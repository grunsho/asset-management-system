services:
  - type: web
    name: asset-management-api
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    autoDeployTrigger: checksPass
    buildCommand: npm ci --include=dev && npx prisma generate --schema=apps/api/prisma/schema.prisma && npm run build --workspace=apps/api
    preDeployCommand: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
    startCommand: npm run start --workspace=apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.23.3
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: asset-management-postgres
          property: connectionString

databases:
  - name: asset-management-postgres
    databaseName: asset_management
    user: asset_management
    plan: 0.1c-256mb
    postgresMajorVersion: '16'
