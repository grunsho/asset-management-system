services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      CLIENT_URL: ${CLIENT_URL:?Set CLIENT_URL}
    depends_on:
      migrate:
        condition: service_completed_successfully
    expose:
      - '4000'

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: migrator
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  bootstrap-admin:
    build:
      context: .
      dockerfile: Dockerfile.backend
      target: migrator
    command: ['npm', 'exec', '--workspace=apps/api', 'prisma', 'db', 'seed']
    profiles: ['bootstrap']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}?schema=public
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Set ADMIN_EMAIL for bootstrap}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD for bootstrap}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: 'no'

  web:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-8080}:80'

volumes:
  postgres_data:
